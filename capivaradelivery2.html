.hero small{color:#ffae6b;font-weight:800;font-size:16px}
.hero h1{font-size:34px;line-height:1.05;margin:6px 0 10px;max-width:60%}
.hero p{max-width:62%;font-size:15px;line-height:1.35}.hero p b{color:#ffae6b}
.mascot{position:absolute;right:14px;top:16px;background:#fff;border:4px solid #7a4a25;border-radius:50%;width:104px;height:104px;overflow:hidden;box-shadow:0 6px 16px #0006}.mascot img{width:100%;height:100%;object-fit:cover;object-position:38% 50%;transform:scale(1.15)}.local{position:absolute;left:20px;bottom:128px;font-size:12px;font-weight:800;background:#0009;padding:4px 10px;border-radius:99px;text-shadow:none}

.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;padding:0 12px;margin-top:-118px;position:relative}
.tile{background:#fff;border-radius:var(--r);padding:14px 6px;text-align:center;box-shadow:0 4px 14px #0002;position:relative;color:var(--ink)}
.tile i{display:grid;place-items:center;width:46px;height:46px;margin:0 auto 6px;background:var(--o);border-radius:12px;font-style:normal;font-size:24px}
.tile b{display:block;font-size:14px}.tile span{display:block;font-size:11px;color:var(--mut);margin-top:2px}
.dot{position:absolute;top:6px;right:8px;background:var(--bad);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.banner{display:block;width:calc(100% - 24px);margin:12px;padding:15px;background:var(--o);color:#fff;font-weight:800;border-radius:var(--r);font-size:15px}
.tip{margin:0 12px 12px;padding:14px;border-radius:var(--r);background:#fff;border-left:6px solid #7a4a25;font-size:14px;line-height:1.4}
.bar{display:flex;align-items:center;gap:10px;padding:14px 14px 6px;position:sticky;top:0;background:var(--bg);z-index:5}
.bar h2{font-size:22px;flex:1}
.back{background:#fff;width:40px;height:40px;border-radius:12px;font-size:20px;box-shadow:0 2px 8px #0002}
.pad{padding:8px 12px}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 2px 10px #0001}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mut{color:var(--mut);font-size:13px}
.btn{background:var(--o);color:#fff;font-weight:800;padding:11px 14px;border-radius:12px}
.btn.g{background:#efe3d6;color:var(--ink)}.btn.r{background:#fbe1dd;color:var(--bad)}.btn.w{background:#25d366}
.btn.sm{padding:7px 11px;font-size:13px}.full{width:100%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 8px}
.chip{white-space:nowrap;background:#fff;border-radius:99px;padding:7px 13px;font-weight:700;font-size:13px;box-shadow:0 1px 5px #0002}
.chip.on{background:var(--o);color:#fff}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:99px;background:#efe3d6}
.s0{background:#ffe3c7;color:#b45309}.s1{background:#fff2b8;color:#8a6d00}.s2{background:#d5e8ff;color:#1f5da8}.s3{background:#d4f2df;color:var(--ok)}.s4{background:#fbe1dd;color:var(--bad)}
input,select{font:inherit;width:100%;padding:11px 12px;border:2px solid #e7d9c9;border-radius:12px;background:#fff;margin-top:4px}
label{display:block;font-weight:700;font-size:13px;margin-top:10px}
.sw{position:relative;width:46px;height:26px;background:#cbbba9;border-radius:99px;padding:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--ok)}.sw.on::after{left:23px}
.nav{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);width:calc(min(480px,100%) - 24px);display:flex;background:#fff;border-radius:var(--r);box-shadow:0 4px 20px #0004;z-index:9}
.nav button{flex:1;background:none;padding:10px 0;font-size:12px;font-weight:700;color:#444}
.nav button span{display:block;font-size:22px}.nav button.on{color:var(--o)}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}.kpi .card{margin:0}.kpi b{font-size:22px;display:block}
.modal{position:fixed;inset:0;background:#000a;display:grid;place-items:end center;z-index:20}
.modal>div{background:#fff;width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:18px;max-height:90vh;overflow:auto}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#2b1d14;color:#fff;padding:11px 18px;border-radius:99px;z-index:30;font-weight:700;font-size:14px;max-width:90%}
.empty{text-align:center;padding:28px;color:var(--mut)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function dica(){
  const d=new Date().getDay(),cnt={};
  S.orders.filter(o=>o.st<4).forEach(o=>o.items.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+i.q));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
  const base=[6,5,0].includes(d)?'Fim de semana em Montes Claros: família à mesa e pedido alto. Deixe o prato principal em destaque no cardápio.':'Dia de semana: o almoço executivo do Centro e do Norte Shopping puxa os pedidos. Confira o horário de pico entre 11h30 e 13h.';
  return`🦫 <b>Dica da Capivara</b><br>${base}${top?` Item mais pedido agora: <b>${esc(top[0])}</b>.`:''}`;
}

V.rest=()=>{const r=S.rest;return bar('Meu Restaurante')+`<div class="pad"><div class="card">
  <div class="row"><div><b style="font-size:18px">${esc(r.n)}</b><div class="mut">${esc(r.end)}</div></div>
  <button class="sw ${r.open?'on':''}" role="switch" aria-checked="${!!r.open}" aria-label="Restaurante aberto" onclick="S.rest.open=+!S.rest.open;save();draw()"></button></div>
  <p class="tag ${r.open?'s3':'s4'}" style="margin-top:10px">${r.open?'Aberto para pedidos':'Fechado'}</p></div>
  <div class="card"><div class="mut">Telefone</div><b>${esc(r.tel)}</b><div class="mut" style="margin-top:8px">Horário</div><b>${esc(r.hor)}</b>
  <div class="mut" style="margin-top:8px">Entrega</div><b>${R(S.cfg.taxa)} · ${S.cfg.tempo} min</b></div>
  <button class="btn full" onclick="editRest()">Editar dados do restaurante</button></div>`};
function editRest(){form('Dados do restaurante',[['n','Nome',S.rest.n],['end','Endereço',S.rest.end],['tel','Telefone',S.rest.tel],['hor','Horário',S.rest.hor]],v=>{Object.assign(S.rest,v);save();draw();toast('Dados salvos')})}

V.orders=()=>{
  const l=S.orders.filter(o=>flt<0||o.st==flt).sort((a,b)=>b.t-a.t);
  const ch=[[-1,'Todos'],[0,'Novos'],[1,'Preparando'],[2,'Na rua'],[3,'Entregues']];
  return bar('Pedidos')+`<div class="chips">${ch.map(c=>`<button class="chip ${flt==c[0]?'on':''}" onclick="flt=${c[0]};draw()">${c[1]}</button>`).join('')}</div>
  <div class="pad"><button class="btn g full" style="margin-bottom:10px" onclick="simular()">＋ Simular pedido de teste</button>
  ${l.length?l.map(oCard).join(''):'<div class="empty">Nenhum pedido aqui. Quando chegar, ele aparece nesta lista.</div>'}</div>`};
function oCard(o){
  const c=cli(o.cli),lab=['Aceitar pedido','Saiu para entrega','Marcar entregue'][o.st];
  const msg=['Olá, '+c.n+'! Recebemos seu pedido #'+o.id+' no '+S.rest.n+'.','Seu pedido #'+o.id+' está sendo preparado!','Seu pedido #'+o.id+' saiu para entrega. Bom apetite!','Pedido #'+o.id+' entregue. Obrigado pela preferência!','Seu pedido #'+o.id+' foi cancelado.'][o.st];
  return`<div class="card"><div class="row"><b>#${o.id} · ${esc(c.n)}</b><span class="tag s${o.st}">${ST[o.st]}</span></div>
  <div class="mut">${hm(o.t)} · ${esc(c.b)} · ${esc(o.pay)}</div>
  <div style="margin:8px 0;font-size:14px">${o.items.map(i=>`${i.q}× ${esc(i.n)}`).join('<br>')}</div>
  <div class="row"><b>${R(tot(o))}</b><span class="mut">c/ entrega</span></div>
  <div class="row" style="margin-top:10px;flex-wrap:wrap;justify-content:flex-start">
  ${o.st<3?`<button class="btn sm" onclick="avanca(${o.id})">${lab}</button><button class="btn sm r" onclick="cancela(${o.id})">Cancelar</button>`:''}
  <a class="btn sm w" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/55${dg(c.tel)}?text=${encodeURIComponent(msg)}">WhatsApp</a></div></div>`}
function avanca(id){const o=S.orders.find(x=>x.id==id);o.st++;
  if(o.st==3){const c=S.clients.find(x=>x.id==o.cli);if(c){const g=tot(o)*S.cfg.cb/100;c.cb=+(c.cb+g).toFixed(2);toast('Entregue! '+R(g)+' de cashback para '+c.n.split(' ')[0])}}
  save();draw()}
function cancela(id){if(confirm('Cancelar o pedido #'+id+'?')){S.orders.find(x=>x.id==id).st=4;save();draw()}}
function simular(){
  const ds=S.menu.filter(m=>m.a);if(!ds.length){toast('Ative ao menos um item no cardápio');return}
  const c=S.clients[Math.floor(Math.random()*S.clients.length)];
  const its=[...ds].sort(()=>Math.random()-.5).slice(0,1+Math.floor(Math.random()*3)).map(m=>({n:m.n,q:1+Math.floor(Math.random()*2),p:m.p}));
  S.orders.push({id:S.next++,cli:c.id,items:its,pay:['Pix','Cartão','Dinheiro'][Math.floor(Math.random()*3)],st:0,t:Date.now()});
  save();draw();toast('Novo pedido de '+c.n.split(' ')[0])}

V.sales=()=>{
  const day=startDay(),ok=S.orders.filter(o=>o.st<4),hoje=S.orders.filter(o=>o.st==3&&o.t>=day);
  const vh=hoje.reduce((s,o)=>s+tot(o),0),tk=vh&&hoje.length?vh/hoje.length:0;
  const serie=[...S.hist,vh],mx=Math.max(...serie,1),dn=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
  const lbl=serie.map((_,i)=>dn[(new Date().getDay()-(6-i)+14)%7]);
  const cnt={},pg={};ok.forEach(o=>{pg[o.pay]=(pg[o.pay]||0)+1;o.items.forEach(i=>cnt[i.n]=(cnt[i.n]||0)+i.q)});
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return bar('Vendas')+`<div class="pad"><div class="kpi"><div class="card"><span class="mut">Vendido hoje</span><b>${R(vh)}</b></div><div class="card"><span class="mut">Ticket médio</span><b>${R(tk)}</b></div>
  <div class="card"><span class="mut">Entregues hoje</span><b>${hoje.length}</b></div><div class="card"><span class="mut">Em andamento</span><b>${S.orders.filter(o=>o.st<3).length}</b></div></div>
  <div class="card" style="margin-top:10px"><b>Últimos 7 dias</b>
  <svg viewBox="0 0 280 130" width="100%" role="img" aria-label="Vendas dos últimos 7 dias">${serie.map((v,i)=>{const h=v/mx*90;return`<rect x="${i*40+6}" y="${100-h}" width="28" height="${h}" rx="6" fill="${i==6?'#F47B20':'#e9b98e'}"/><text x="${i*40+20}" y="118" font-size="10" text-anchor="middle" fill="#7a6a5e">${lbl[i]}</text><text x="${i*40+20}" y="${94-h}" font-size="9" text-anchor="middle" fill="#2b1d14">${Math.round(v)}</text>`}).join('')}</svg></div>
  <div class="card"><b>Mais vendidos</b>${top.length?top.map(t=>`<div class="row" style="margin-top:6px"><span>${esc(t[0])}</span><b>${t[1]}×</b></div>`).join(''):'<p class="mut">Sem vendas ainda.</p>'}</div>
  <div class="card"><b>Formas de pagamento</b>${Object.entries(pg).map(p=>`<div class="row" style="margin-top:6px"><span>${esc(p[0])}</span><b>${p[1]} pedido(s)</b></div>`).join('')||'<p class="mut">Sem dados.</p>'}</div></div>`};

V.menu=()=>{
  const l=S.menu.filter(m=>(m.n+m.c).toLowerCase().includes(q.toLowerCase())),cats=[...new Set(l.map(m=>m.c))];
  return bar('Cardápio')+`<div class="pad"><input type="search" placeholder="Buscar prato ou categoria" value="${esc(q)}" oninput="q=this.value;draw(1)" aria-label="Buscar">
  <button class="btn full" style="margin:10px 0" onclick="editItem()">＋ Novo item</button>
  ${cats.map(c=>`<h3 style="margin:12px 0 6px">${esc(c)}</h3>`+l.filter(m=>m.c==c).map(m=>`<div class="card"><div class="row"><div><b>${esc(m.n)}</b> ${m.star?'<span class="tag s0">⭐ mais pedido</span>':''}<div>${R(m.p)}</div></div>
  <div style="display:flex;gap:8px;align-items:center"><button class="btn g sm" onclick="editItem(${m.id})">Editar</button><button class="sw ${m.a?'on':''}" role="switch" aria-checked="${!!m.a}" aria-label="Disponível" onclick="togItem(${m.id})"></button></div></div></div>`).join('')).join('')||'<div class="empty">Nada encontrado.</div>'}</div>`};
function togItem(id){const m=S.menu.find(x=>x.id==id);m.a=+!m.a;save();draw(1)}
function editItem(id){const m=S.menu.find(x=>x.id==id)||{n:'',c:'Pratos',p:''};
  form(id?'Editar item':'Novo item',[['n','Nome',m.n],['c','Categoria',m.c],['p','Preço (R$)',m.p,'number']],v=>{
    if(!v.n.trim()||!(+v.p>0)){toast('Informe nome e preço');return false}
    if(id){Object.assign(m,{n:v.n,c:v.c||'Outros',p:+v.p})}else S.menu.push({id:Date.now(),n:v.n,c:v.c||'Outros',p:+v.p,a:1});
    save();draw(1);toast('Item salvo')},id?()=>{if(confirm('Excluir este item?')){S.menu=S.menu.filter(x=>x.id!=id);save();draw(1)}}:null)}

V.clients=()=>{
  const l=S.clients.filter(c=>(c.n+c.b).toLowerCase().includes(q.toLowerCase()));
  return bar('Clientes')+`<div class="pad"><input type="search" placeholder="Buscar nome ou bairro" value="${esc(q)}" oninput="q=this.value;draw(1)" aria-label="Buscar">
  <button class="btn full" style="margin:10px 0" onclick="editCli()">＋ Novo cliente</button>
  ${l.map(c=>{const os=S.orders.filter(o=>o.cli==c.id&&o.st==3),g=os.reduce((s,o)=>s+tot(o),0);
  return`<div class="card"><div class="row"><b>${esc(c.n)}</b><span class="tag s3">Cashback ${R(c.cb)}</span></div><div class="mut">${esc(c.b)}, Montes Claros · ${esc(c.tel)}</div>
  <div class="mut" style="margin:6px 0">${os.length} pedido(s) entregue(s) · ${R(g)} gasto(s)</div>
  <div class="row" style="justify-content:flex-start"><a class="btn sm w" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/55${dg(c.tel)}?text=${encodeURIComponent('Olá '+c.n.split(' ')[0]+'! Tem novidade no '+S.rest.n+'. Você tem '+R(c.cb)+' de cashback para usar.')}">Chamar no WhatsApp</a></div></div>`}).join('')||'<div class="empty">Nenhum cliente encontrado.</div>'}</div>`};
function editCli(){form('Novo cliente',[['n','Nome',''],['tel','WhatsApp com DDD','','tel'],['b','Bairro','']],v=>{
  if(!v.n.trim()||dg(v.tel).length<10){toast('Informe nome e WhatsApp com DDD');return false}
  S.clients.push({id:Date.now(),n:v.n,tel:dg(v.tel),b:v.b,cb:0});save();draw(1);toast('Cliente cadastrado')})}

V.cfg=()=>bar('Configurações')+`<div class="pad"><div class="card">
  <label>Taxa de entrega (R$)<input id="c1" type="number" step="0.5" value="${S.cfg.taxa}"></label>
  <label>Tempo médio de entrega (min)<input id="c2" type="number" value="${S.cfg.tempo}"></label>
  <label>Cashback ao cliente (% do pedido)<input id="c3" type="number" step="0.5" value="${S.cfg.cb}"></label>
  <button class="btn full" style="margin-top:14px" onclick="saveCfg()">Salvar ajustes</button></div>
  <button class="btn g full" style="margin-bottom:10px" onclick="exporta()">Baixar backup dos dados</button>
  <button class="btn r full" onclick="if(confirm('Apagar todos os dados e voltar ao exemplo?')){localStorage.removeItem(K);load();go('home')}">Restaurar dados de exemplo</button></div>`;
function saveCfg(){S.cfg={taxa:+$('#c1').value||0,tempo:+$('#c2').value||0,cb:+$('#c3').value||0};save();toast('Ajustes salvos')}
function exporta(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='capivara-backup.json';a.click()}

V.news=()=>bar('Novidades e comunicados')+`<div class="pad">${[
 ['🦫 Bem-vindo ao Capivara Delivery','Sistema feito para os restaurantes de Montes Claros. Aqui os dados ficam no seu aparelho.'],
 ['💚 Cashback ligado','Cada pedido entregue gera cashback para o cliente. Ajuste o percentual em Configurações.'],
 ['🌧️ Dica de chuva','Em dia de chuva o delivery sobe. Confira o tempo médio de entrega antes do horário de pico.']
 ].map(n=>`<div class="card"><b>${n[0]}</b><p class="mut" style="margin-top:4px">${n[1]}</p></div>`).join('')}</div>`;

V.more=()=>bar('Mais')+`<div class="pad">${[['rest','🏪 Meu Restaurante'],['menu','📋 Cardápio'],['clients','👥 Clientes'],['cfg','⚙️ Configurações'],['news','🔔 Novidades e comunicados']].map(x=>`<button class="card full" style="text-align:left;font-weight:800" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div>`;

/* ---------- formulário em modal ---------- */
function form(title,fs,onSave,onDel){
  const m=document.createElement('div');m.className='modal';
  m.innerHTML=`<div role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${fs.map(f=>`<label>${f[1]}<input id="f_${f[0]}" type="${f[3]||'text'}" step="0.01" value="${esc(f[2])}"></label>`).join('')}
  <div class="row" style="margin-top:16px"><button class="btn g" id="fx">Cancelar</button>${onDel?'<button class="btn r" id="fd">Excluir</button>':''}<button class="btn" id="fs">Salvar</button></div></div>`;
  document.body.appendChild(m);const close=()=>m.remove();
  m.querySelector('input').focus();
  m.onclick=e=>{if(e.target==m)close()};
  m.querySelector('#fx').onclick=close;
  if(onDel)m.querySelector('#fd').onclick=()=>{close();onDel()};
  m.querySelector('#fs').onclick=()=>{const v={};fs.forEach(f=>v[f[0]]=m.querySelector('#f_'+f[0]).value);if(onSave(v)!==false)close()};
}

/* ---------- desenho ---------- */
function draw(keepFocus){
  const pos=keepFocus?scrollY:0,f=document.activeElement&&document.activeElement.type=='search';
  $('#main').innerHTML=V[view]();
  const cur={home:'home',orders:'orders',sales:'sales'}[view]||'more';
  $('#nav').innerHTML=[['home','🏠','Início'],['orders','📋','Pedidos'],['sales','📊','Vendas'],['more','⚙️','Mais']].map(n=>`<button class="${cur==n[0]?'on':''}" onclick="go('${n[0]}')"><span>${n[1]}</span>${n[2]}</button>`).join('');
  if(keepFocus){scrollTo(0,pos);if(f){const i=$('input[type=search]');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length)}}}
}
load();draw();
</script>
</body>
